<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Diagnósticos · Painel Lince</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#110B08;--card:#1D1511;--card-2:#251b16;--ink:#F1EDE5;--ink-2:#988E84;--bronze:#BAA079;--ouro:#D6C294;--linha:rgba(214,203,182,.18);--erro:#E0A3A6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg)}
main{max-width:980px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
header img{width:48px;height:48px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--linha)}
header .tit{flex:1;min-width:200px}
header .casa{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:.38em;text-transform:uppercase;color:var(--ouro);font-size:.85rem}
header h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:2rem;line-height:1.1;margin:2px 0 0}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:500 .68rem/1 Inter,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;border-radius:2px;padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-cheio{color:var(--bg);background:var(--bronze);border:1px solid var(--bronze)}
.btn-cheio:hover{background:var(--ouro);border-color:var(--ouro)}
.btn-linha{color:var(--bronze);background:transparent;border:1px solid rgba(186,160,121,.45)}
.btn-linha:hover{border-color:var(--bronze);color:var(--ouro)}
.btn:disabled{opacity:.5;cursor:wait}
.barra{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.barra input[type=search]{flex:1;min-width:200px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--linha);border-radius:2px;padding:10px 12px}
.barra input[type=search]:focus{outline:none;border-color:var(--bronze)}
.alterna{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.85rem;cursor:pointer;user-select:none}
.alterna input{accent-color:var(--bronze);margin:0}
.conta{color:var(--ink-2);font-size:.85rem}
.envio{background:var(--card);border:1px solid var(--linha);border-radius:4px;margin-bottom:10px}
.envio.arquivado{opacity:.6}
.envio summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:baseline}
.envio summary::-webkit-details-marker{display:none}
.envio summary:hover{background:var(--card-2)}
.envio .quem{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.35rem;font-weight:500}
.envio .quando{color:var(--ink-2);font-size:.8rem;font-variant-numeric:tabular-nums;text-align:right}
.envio .sub{grid-column:1/-1;color:var(--ink-2);font-size:.85rem}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.7rem;letter-spacing:.06em;color:var(--ouro);border:1px solid rgba(214,194,148,.3);border-radius:2px;padding:2px 7px}
.chip.alerta{color:var(--erro);border-color:rgba(224,163,166,.4)}
.chip.neutro{color:var(--ink-2);border-color:var(--linha)}
.corpo{border-top:1px solid var(--linha);padding:8px 18px 18px}
.secao{margin-top:18px}
.secao h3{margin:0 0 4px;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:1.25rem;color:var(--ouro)}
.resp{padding:12px 0;border-bottom:1px solid var(--linha)}
.resp:last-child{border-bottom:0}
.resp .p{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze);margin-bottom:6px}
.resp .r{white-space:pre-wrap;word-break:break-word}
.resp .r.vazia{color:var(--ink-2);font-style:italic}
.rodape-envio{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.vazio,.estado{color:var(--ink-2);text-align:center;padding:48px 16px;border:1px dashed var(--linha);border-radius:4px}
.erro{color:var(--erro)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ouro);color:var(--bg);padding:10px 16px;border-radius:2px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:1px solid var(--ouro);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <img src="/marca/selo-lince.jpg" alt="">
    <div class="tit"><div class="casa">Lince</div><h1>Diagnósticos dos clientes</h1></div>
    <div class="acoes">
      <a class="btn btn-linha" href="/" target="_blank" rel="noopener">Ver formulário</a>
      <button class="btn btn-linha" id="copiar-link">Copiar link do formulário</button>
      <a class="btn btn-cheio" href="/api/painel/exportar">Exportar planilha</a>
      <a class="btn btn-linha" href="/api/painel/backup">Backup completo</a>
      <a class="btn btn-linha" href="/painel/sair">Sair</a>
    </div>
  </header>

  <div class="barra">
    <input type="search" id="busca" placeholder="Buscar por nome, profissão ou cidade" autocomplete="off">
    <label class="alterna"><input type="checkbox" id="ver-arquivados">Mostrar arquivados</label>
    <span class="conta" id="conta"></span>
  </div>

  <div id="lista"><div class="estado">Carregando</div></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
let ds = [];
const abertos = new Set();

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const quando = (iso) => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 1800);
}

async function copiar(txt, msg = "Copiado") {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch { toast("Não deu pra copiar; selecione e copie à mão"); }
}

function textoTodo(d) {
  const l = [`Diagnóstico · ${d.nome}`, `Recebido em ${quando(d.criado_em)} · protocolo ${d.codigo}`, ""];
  let s = null;
  for (const r of d.respostas) {
    if (r.secao !== s) { s = r.secao; l.push("", `SEÇÃO ${r.secao}: ${String(r.secaoTitulo).toUpperCase()}`, ""); }
    l.push(r.pergunta, r.resposta || "(sem resposta)", "");
  }
  return l.join("\n");
}

function corpoHtml(d) {
  if (d.erro) return `<p class="erro">${esc(d.erro)}</p>`;
  const grupos = [];
  for (const r of d.respostas) {
    let g = grupos.find((x) => x.secao === r.secao);
    if (!g) grupos.push((g = { secao: r.secao, titulo: r.secaoTitulo, itens: [] }));
    g.itens.push(r);
  }
  return grupos.map((g) => `<div class="secao"><h3>${g.secao ? `${g.secao}. ` : ""}${esc(g.titulo)}</h3>
    ${g.itens.map((r) => `<div class="resp"><div class="p">${esc(r.pergunta)}</div><div class="r ${r.resposta ? "" : "vazia"}">${r.resposta ? esc(r.resposta) : "sem resposta"}</div></div>`).join("")}
  </div>`).join("");
}

function render() {
  const q = norm(document.getElementById("busca").value.trim());
  const verArq = document.getElementById("ver-arquivados").checked;
  const lista = ds.filter((d) => (verArq || !d.arquivado_em) && (!q || norm(`${d.nome} ${d.profissao} ${d.cidade}`).includes(q)));
  const arq = ds.filter((d) => d.arquivado_em).length;
  document.getElementById("conta").textContent = `${lista.length} diagnóstico${lista.length === 1 ? "" : "s"}${arq && !verArq ? ` · ${arq} arquivado${arq === 1 ? "" : "s"}` : ""}`;
  const el = document.getElementById("lista");
  if (!ds.length) { el.innerHTML = `<div class="vazio">Nenhum diagnóstico ainda. Mande o link do formulário pro cliente.</div>`; return; }
  if (!lista.length) { el.innerHTML = `<div class="vazio">Nada com esse filtro.</div>`; return; }
  el.innerHTML = lista.map((d) => {
    const chips = [
      `<span class="chip neutro">Protocolo ${esc(d.codigo)}</span>`,
      d.copia_status === "ok" ? `<span class="chip">Cópia no ClickUp</span>` : d.copia_status === "pendente" ? `<span class="chip neutro">Cópia no ClickUp em andamento</span>` : `<span class="chip alerta" title="${esc(d.copia_status)}">Cópia no ClickUp falhou</span>`,
      d.suspeito ? `<span class="chip alerta" title="O campo escondido contra robô veio preenchido. Confira se é um cliente de verdade.">Conferir: possível robô</span>` : "",
      d.arquivado_em ? `<span class="chip neutro">Arquivado em ${quando(d.arquivado_em)}</span>` : "",
    ].join("");
    const sub = [d.profissao, d.cidade].filter(Boolean).map(esc).join(" · ");
    return `<details class="envio ${d.arquivado_em ? "arquivado" : ""}" data-id="${d.id}" ${abertos.has(d.id) ? "open" : ""}>
      <summary><span class="quem">${esc(d.nome)}</span><span class="quando">${quando(d.criado_em)}</span>${sub ? `<span class="sub">${sub}</span>` : ""}<span class="chips">${chips}</span></summary>
      <div class="corpo">${corpoHtml(d)}
        <div class="rodape-envio">
          <button class="btn btn-linha" data-copiar="${d.id}">Copiar tudo</button>
          <a class="btn btn-linha" href="/api/painel/exportar?id=${d.id}">Exportar este</a>
          ${d.copia_status !== "ok" ? `<button class="btn btn-linha" data-reenviar="${d.id}">Reenviar cópia pro ClickUp</button>` : ""}
          <button class="btn btn-linha" data-arquivar="${d.id}">${d.arquivado_em ? "Desarquivar" : "Arquivar"}</button>
        </div>
      </div>
    </details>`;
  }).join("");
}

async function carregar() {
  try {
    const r = await fetch("/api/painel/lista");
    if (r.status === 401) { location.href = "/painel/"; return; }
    if (!r.ok) throw new Error();
    ds = (await r.json()).diagnosticos;
    render();
  } catch {
    document.getElementById("lista").innerHTML = `<div class="estado erro">Não consegui carregar os diagnósticos. Recarregue a página.</div>`;
  }
}

async function post(url, corpo) {
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(corpo) });
  return { ok: r.ok, d: await r.json().catch(() => ({})) };
}

document.addEventListener("toggle", (ev) => {
  const el = ev.target;
  if (el.matches && el.matches("details.envio")) el.open ? abertos.add(Number(el.dataset.id)) : abertos.delete(Number(el.dataset.id));
}, true);

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.id === "copiar-link") return copiar(location.origin + "/", "Link do formulário copiado");
  const achar = (k) => ds.find((x) => x.id === Number(b.dataset[k]));
  if (b.dataset.copiar) return copiar(textoTodo(achar("copiar")), "Diagnóstico copiado");
  if (b.dataset.arquivar) {
    const d = achar("arquivar");
    const arquivar = !d.arquivado_em;
    if (arquivar && !confirm(`Arquivar o diagnóstico de ${d.nome}?\n\nEle sai da lista, mas continua guardado: dá pra ver em "Mostrar arquivados" e desarquivar quando quiser.`)) return;
    b.disabled = true;
    const { ok, d: res } = await post("/api/painel/arquivar", { id: d.id, arquivar });
    if (ok) { d.arquivado_em = res.arquivado_em; render(); toast(arquivar ? "Arquivado" : "Desarquivado"); }
    else { b.disabled = false; toast("Não consegui; tente de novo"); }
  }
  if (b.dataset.reenviar) {
    const d = achar("reenviar");
    b.disabled = true;
    b.textContent = "Enviando";
    const { d: res } = await post("/api/painel/copiar", { id: d.id });
    d.copia_status = res.copia_status || "falhou";
    render();
    toast(res.ok ? "Cópia enviada pro ClickUp" : "A cópia falhou de novo; o diagnóstico continua seguro no banco");
  }
});

document.getElementById("busca").addEventListener("input", render);
document.getElementById("ver-arquivados").addEventListener("change", render);
carregar();
</script>
</body>
</html>
