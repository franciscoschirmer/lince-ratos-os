<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AD01</title>
<link rel="stylesheet" href="../assets/theme.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/fmt-4x5.css">
</head>

<!-- tema:   t-dark | t-light | t-accent
     layout: l-top | l-mid | l-quote | l-bleed | l-card | l-split | l-price | l-stat | l-list
     9x16:   "story-only" libera a base (só use se a peça NÃO roda em Reels)
     debug:  "guias" mostra as danger zones no render. tirar antes de entregar -->
<body class="t-dark l-top">

  <!-- só em l-bleed / l-split. --shift desce o sujeito pra ele não ficar atrás do texto.
  <div class="bg" style="--shift:260px;--zoom:1.14"><img src="../assets/img/AD01.png"></div>
  <div class="scrim"></div>
  -->

  <header class="topo">
    <img class="logo" src="../assets/logo.png" alt="">
  </header>

  <div class="wrap">
    <span class="badge">badge curto</span>
    <h1 class="headline h-xl">a headline que<br><span class="hl">para o scroll</span></h1>
    <p class="subhead">uma frase de apoio, no máximo uma</p>
    <div class="empurra"></div>
    <span class="cta">quero começar</span>
  </div>

  <footer class="rodape">
    <span class="handle">@marca</span>
    <span class="site">marca.com.br</span>
  </footer>

</body>
</html>
